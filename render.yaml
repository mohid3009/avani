services:
  - type: web
    name: avani
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Paste the Neon connection string (ending ?sslmode=require) in the Render dashboard.
      - key: DATABASE_URL
        sync: false
